<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>One click, your instance</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 1280px; height: 800px; display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 44px;
        background: #0f0f0f; color: #eef1f5;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 38px; margin: 0; letter-spacing: -0.02em; text-align: center; }
      h1 span { color: #6dc5ff; }
      p.lead { margin: 0; color: #9aa3b0; font-size: 18px; text-align: center; max-width: 720px; }
      .flow { display: flex; align-items: center; gap: 28px; }
      .card {
        width: 340px; height: 232px; border-radius: 16px; border: 1px solid #262a31;
        background: #17191d; padding: 18px; display: flex; flex-direction: column; gap: 12px;
      }
      .bar { display: flex; align-items: center; gap: 7px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #2e343d; }
      .url { flex: 1; margin-left: 6px; background: #0f0f0f; border: 1px solid #262a31; border-radius: 999px; padding: 4px 11px; font-size: 12px; color: #9aa3b0; }
      .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .thumb { height: 62px; border-radius: 8px; background: #21252b; position: relative; overflow: hidden; }
      .thumb::after { content: ""; position: absolute; left: 10px; right: 30px; bottom: 9px; height: 6px; border-radius: 3px; background: #2e343d; }
      .thumb.focus { outline: 2px solid #6dc5ff; outline-offset: 2px; }
      .player { flex: 1; border-radius: 10px; background: linear-gradient(160deg, #1d2a33, #12171c); border: 1px solid #262a31; position: relative; }
      .player::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 14px; height: 5px; border-radius: 3px; background: #6dc5ff; opacity: 0.55; }
      .arrow { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #6dc5ff; }
      .arrow svg { width: 64px; height: 24px; }
      .arrow span { font-size: 13px; color: #9aa3b0; }
      .tag { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7481; }
    </style>
  </head>
  <body>
    <div>
      <h1>Click a video on YouTube.<br />Watch it on <span>your own instance</span>.</h1>
    </div>
    <div class="flow">
      <div class="card">
        <div class="bar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="url">youtube.com</span>
        </div>
        <div class="tag">A normal video link</div>
        <div class="thumbs">
          <div class="thumb focus"></div><div class="thumb"></div>
          <div class="thumb"></div><div class="thumb"></div>
        </div>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 64 24" fill="none" aria-hidden="true">
          <path d="M2 12h54" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          <path d="M48 5l10 7-10 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>same tab, instantly</span>
      </div>
      <div class="card">
        <div class="bar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="url">ytzero.example.com/watch/…</span>
        </div>
        <div class="tag">Your YT Zero instance</div>
        <div class="player"></div>
      </div>
    </div>
    <p class="lead">Timestamps are carried over. Links that deliberately point back to YouTube are left alone.</p>
  </body>
</html>
