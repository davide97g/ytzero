name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession would otherwise deploy out of order. Queue them
# instead of cancelling: a cancelled run leaves main green and undeployed.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Four jobs instead of one long one: the four run at once, so the wall clock is
  # the slowest lane rather than the sum of every check. `deploy` waits on all of
  # them, so main still only ships once everything is green.
  repository-checks:
    name: Check the repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@v2

      - name: Prevent large files from growing
        run: bun run check:large-files

      - name: Require SQLite and PostgreSQL migrations
        run: bun run check:database-migrations

  typecheck:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@v2

      - name: Cache the Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd=app
          bun install --frozen-lockfile --cwd=ui

      - name: Check server types
        working-directory: app
        run: bun run typecheck

      - name: Check web client types
        working-directory: ui
        run: bun run typecheck

  test:
    name: Test the application and web client
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@v2

      - name: Cache the Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd=app
          bun install --frozen-lockfile --cwd=ui

      - name: Test the server
        working-directory: app
        run: bun run test

      - name: Test the server in randomized order
        working-directory: app
        run: bun run test:random

      - name: Test the web client
        working-directory: ui
        run: bun run test

  build:
    name: Build the web client
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@v2

      - name: Cache the Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install web client dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build the web client
        working-directory: ui
        run: bun run build:prepared

  deploy:
    # Only a real push to main reaches the box — never a pull request, never a
    # branch. Dokploy sits on the LAN behind a Cloudflare tunnel, on a hostname
    # whose path rule allows these two calls and nothing else; the API key gets
    # the request past Dokploy itself. Both live in the repository secrets.
    name: Deploy to the homelab
    needs: [repository-checks, typecheck, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}

    steps:
      # The application status alone cannot say whether a deploy has started yet:
      # it still reads "done" from the previous one for the first few seconds.
      # The id of the newest deployment is what tells this run apart from the
      # last — newest by createdAt, because Dokploy returns the list oldest first.
      - name: Note the current deployment
        run: |
          echo "before=$(curl -fsS --max-time 30 \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            "$DOKPLOY_URL/api/application.one?applicationId=$DOKPLOY_APPLICATION_ID" |
            python3 -c 'import json,sys; d=sorted(json.load(sys.stdin)["deployments"], key=lambda x: x["createdAt"]); print(d[-1]["deploymentId"] if d else "")')" >> "$GITHUB_ENV"

      - name: Trigger the Dokploy deploy
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}" \
            "$DOKPLOY_URL/api/application.deploy"

      # The trigger only queues the build. Without this wait a red deploy still
      # shows a green workflow, which is the one thing this job exists to stop.
      - name: Wait for the deploy to finish
        run: |
          for _ in $(seq 1 120); do
            sleep 15
            latest="$(curl -fsS --max-time 30 \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              "$DOKPLOY_URL/api/application.one?applicationId=$DOKPLOY_APPLICATION_ID" |
              python3 -c 'import json,sys; d=sorted(json.load(sys.stdin)["deployments"], key=lambda x: x["createdAt"]); print(d[-1]["deploymentId"], d[-1]["status"]) if d else print("none idle")')"
            id="${latest%% *}"
            status="${latest##* }"
            if [ "$id" = "$before" ]; then
              echo "waiting for Dokploy to pick up the deploy"
              continue
            fi
            echo "deployment $id: $status"
            case "$status" in
              done) exit 0 ;;
              error) echo "::error::Dokploy reported a failed deploy"; exit 1 ;;
            esac
          done
          echo "::error::deploy still running after 30 minutes"
          exit 1
